<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علی پبلک ماڈل سکول</title>
    <link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jameel Noori Nastaleeq', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Top Blue Area */
        .top-wave { width: 100%; height: 60vh; background: linear-gradient(135deg, #1e88e5, #1565c0); border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; display: flex; justify-content: center; align-items: center; text-align: center; color: white; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
        .logo-area { display: flex; flex-direction: column; align-items: center; }
        
        /* Logo Image Styling */
        .school-logo { width: 120px; height: 120px; background: white; border-radius: 50%; padding: 5px; margin-bottom: 15px; object-fit: contain; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .top-wave h1 { font-size: 36px; font-weight: 700; margin-bottom: 5px; }
        .top-wave p { font-size: 18px; opacity: 0.9; }
        .eng-name { font-size: 14px !important; letter-spacing: 1px; margin-top: 5px; }

        /* Welcome Card */
        .welcome-card { width: 90%; background: white; border-radius: 20px; padding: 30px; margin-top: -50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; z-index: 5; text-align: center; }
        .welcome-card h2 { color: #1565c0; margin-bottom: 10px; font-size: 28px; }
        .welcome-card p { font-size: 18px; color: #555; margin-bottom: 25px; }
        
        .enter-btn { width: 100%; padding: 16px; background: #1e88e5; color: white; border: none; border-radius: 12px; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(30, 136, 229, 0.4); }
        .enter-btn:hover { background: #1565c0; transform: translateY(-2px); }

        /* Copyright Footer */
        .footer { text-align: center; margin-top: 20px; margin-bottom: 20px; padding: 0 20px; }
        .footer .dev { font-size: 13px; color: #1e88e5; font-weight: bold; }
        .footer .copy { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Top Blue Area with Logo -->
    <div class="top-wave">
        <div class="logo-area">
            <img src="logo.jpg" alt="School Logo" class="school-logo">
            <h1>علی پبلک ماڈل سکول</h1>
            <p>بستی ناہواولا نواں</p>
            <p class="eng-name">ALI PUBLIC MODEL SCHOOL</p>
        </div>
    </div>

    <!-- Welcome Card -->
    <div class="welcome-card">
        <h2>خوش آمدید!</h2>
        <p>علی پبلک ماڈل سکول کے مینجمنٹ سسٹم میں داخل ہونے کے لیے نیچے والا بٹن دبائیں۔</p>
        <button class="enter-btn" onclick="enterApp()">ایپ میں داخل ہوں</button>
    </div>

    <!-- Copyright Footer -->
    <div class="footer">
        <p class="dev">DEVELOPED BY: KHALIL DEVELOPER</p>
        <p class="copy">COPYRIGHT © 2025 ALI PUBLIC MODEL SCHOOL BASTI NAHO WALA NAWAN</p>
        <p class="copy">ALL RIGHTS RESERVED.</p>
    </div>

    <!-- JavaScript -->
    <script>
        function enterApp() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
