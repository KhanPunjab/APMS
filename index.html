<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علی پبلک ماڈل سکول</title>
    <link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jameel Noori Nastaleeq', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .top-wave { width: 100%; height: 45vh; background: linear-gradient(135deg, #1e88e5, #1565c0); border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; display: flex; justify-content: center; align-items: center; text-align: center; color: white; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .logo-area { display: flex; flex-direction: column; align-items: center; }
        .school-logo { width: 80px; height: 80px; background: white; border-radius: 50%; padding: 10px; margin-bottom: 10px; }
        .top-wave h1 { font-size: 32px; font-weight: 700; margin-bottom: 5px; }
        .top-wave p { font-size: 18px; opacity: 0.9; }
        .eng-name { font-size: 12px !important; letter-spacing: 1px; margin-top: 5px; }
        .login-card { width: 90%; background: white; border-radius: 20px; padding: 25px; margin-top: -50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .login-card h2 { text-align: center; color: #1565c0; margin-bottom: 20px; font-size: 30px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 18px; color: #555; margin-bottom: 5px; text-align: right; }
        
        /* Password wrapper for eye icon */
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; background: #f9f9f9; text-align: right; outline: none; padding-left: 40px; }
        .password-wrapper input:focus { border-color: #1e88e5; background: white; }
        .toggle-eye { position: absolute; left: 10px; cursor: pointer; font-size: 18px; color: #777; user-select: none; }
        
        .input-group input:not(.password-wrapper input) { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; background: #f9f9f9; text-align: right; outline: none; }
        .input-group input:focus { border-color: #1e88e5; background: white; }
        
        .login-btn { width: 100%; padding: 14px; background: #1e88e5; color: white; border: none; border-radius: 10px; font-size: 22px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .login-btn:hover { background: #1565c0; }
        .forgot-pass { text-align: center; font-size: 16px; color: #777; margin-top: 15px; }
        .forgot-pass a { color: #1e88e5; text-decoration: none; }
        
        /* Copyright Footer */
        .footer { text-align: center; margin-top: 20px; margin-bottom: 20px; padding: 0 20px; }
        .footer .dev { font-size: 13px; color: #1e88e5; font-weight: bold; }
        .footer .copy { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Top Blue Area -->
    <div class="top-wave">
        <div class="logo-area">
            <img src="https://cdn-icons-png.flaticon.com/512/2603/2603689.png" alt="School Logo" class="school-logo">
            <h1>علی پبلک ماڈل سکول</h1>
            <p>بستی ناہواولا نواں</p>
            <p class="eng-name">ALI PUBLIC MODEL SCHOOL</p>
        </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <h2>لاگ ان کریں</h2>
        
        <div class="input-group">
            <label>ای میل / یوزر نیم</label>
            <input type="text" id="username" placeholder="admin@school.com">
        </div>

        <div class="input-group">
            <label>پاس ورڈ</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="........">
                <span class="toggle-eye" onclick="togglePassword()">👁️</span>
            </div>
        </div>

        <button class="login-btn" onclick="login()">لاگ ان کریں</button>
        
        <p class="forgot-pass">پاس ورڈ بھول گئے؟ <a href="#">یہاں کلک کریں</a></p>
    </div>

    <!-- Copyright Footer -->
    <div class="footer">
        <p class="dev">DEVELOPED BY: KHALIL DEVELOPER</p>
        <p class="copy">COPYRIGHT © 2025 ALI PUBLIC MODEL SCHOOL BASTI NAHO WALA NAWAN</p>
        <p class="copy">ALL RIGHTS RESERVED.</p>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Firebase SDK Import
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Aapka Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDHS3lvjt8W8mxaJR-WHcLQP1djYFlY2uU",
            authDomain: "ali-school-app.firebaseapp.com",
            projectId: "ali-school-app",
            storageBucket: "ali-school-app.firebasestorage.app",
            messagingSenderId: "229544574495",
            appId: "1:229544574495:web:3dc249e8306c69fdb81f2a",
            measurementId: "G-C3JFZWPKCB"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Login Function
        window.login = function() {
            var email = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if(email === "" || password === "") {
                alert("براہ کرم ای میل اور پاس ورڈ دونوں درج کریں!");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("غلط ای میل یا پاس ورڈ! براہ کرم دوبارہ کوشش کریں۔");
                });
        }

        // Toggle Password Visibility
        window.togglePassword = function() {
            var passwordField = document.getElementById("password");
            var eyeIcon = document.querySelector(".toggle-eye");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                eyeIcon.textContent = "🙈"; // Change icon to monkey
            } else {
                passwordField.type = "password";
                eyeIcon.textContent = "👁️"; // Change icon back to eye
            }
        }
    </script>

</body>
</html>
